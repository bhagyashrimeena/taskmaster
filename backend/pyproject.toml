[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-copilot"
version = "0.1.0"
description = "Google ADK personalized portfolio-news pipeline for Wealth Copilot"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141,<1",
  "google-adk[mcp]==2.5.0",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wealth_copilot*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires network access and the live Zerodha MCP endpoint"]
